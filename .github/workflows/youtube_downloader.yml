name:     یوتیوب دانلودر

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

      output_format:
        description: 'نوع خروجی'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'

      desired_quality:
        description: 'کیفیت (ویدیو: 720p, 1080p | صدا: 192kbps, 320kbps)'
        required: false
        type: string
        default: '720p'

      max_part_mb:
        description: 'حداکثر حجم هر قسمت (MB) - 0 = خودکار ۱۸۰۰ مگابایت'
        required: false
        type: string
        default: '90'

      upload_method:
        description: '📤 روش ذخیره نهایی'
        required: true
        type: choice
        options:
          - repository (push to repo)
          - release (GitHub Releases)
        default: 'repository (push to repo)'

      release_tag:
        description: '🏷️ نام تگ ریلیز (فقط در صورت انتخاب Release)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  youtube-download:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📂 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zip curl python3 python3-pip
          pip3 install --quiet requests

      - name: 🔗 Get Download Link
        id: retrieve
        run: |
          python3 << 'EOF'
          import os, sys, time, re, requests

          URL  = os.environ.get('INPUT_URL')
          FMT  = os.environ.get('INPUT_FORMAT')
          QUAL = os.environ.get('INPUT_QUALITY')

          is_audio = FMT == 'mp3'
          if is_audio:
              QUAL = QUAL if QUAL in ('64kbps','128kbps','192kbps','320kbps') else '192kbps'
          else:
              QUAL = QUAL if QUAL in ('720p','1080p') else '720p'

          payload = {
              "url": URL,
              "os": "linux",
              "output": {"type": "audio" if is_audio else "video", "format": FMT}
          }
          if is_audio:
              payload["audio"] = {"bitrate": QUAL}
          else:
              payload["output"]["quality"] = QUAL

          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})
          s.get("https://media.ytmp3.gg/")

          resp = s.post("https://hub.ytconvert.org/api/download", json=payload, timeout=30)
          resp.raise_for_status()
          data = resp.json()

          status_url = data.get('statusUrl')
          title = data.get('title', 'video')

          dl_url = None
          for _ in range(150):
              time.sleep(2)
              r = s.get(status_url, timeout=20)
              status = r.json()
              if status.get('status') == 'completed':
                  dl_url = status.get('downloadUrl')
                  break
              if status.get('status') == 'failed':
                  print("::error::Server failed to prepare the video")
                  sys.exit(1)

          if not dl_url:
              print("::error::Could not get download link")
              sys.exit(1)

          vid   = re.search(r'(?:v=|youtu\.be/)([a-zA-Z0-9_-]{11})', URL)[1]
          clean = re.sub(r'[^a-zA-Z0-9\-_()\[\]]', '_', title.replace(' ', '_'))
          clean = re.sub(r'_+', '_', clean).strip('_')[:70] or vid
          clean = clean.lstrip('-')
          fname = f"{clean}_{vid}_{QUAL}.{FMT}"

          with open(".download_info", "w", encoding="utf-8") as f:
              f.write(f"{dl_url}\n{fname}\n{title}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"filename={fname}\n")
              f.write(f"title={title}\n")
          EOF
        env:
          INPUT_URL:     ${{ github.event.inputs.video_url }}
          INPUT_FORMAT:  ${{ github.event.inputs.output_format == 'mp3 (audio only)' && 'mp3' || 'mp4' }}
          INPUT_QUALITY: ${{ github.event.inputs.desired_quality }}

      - name: 📥 Download File
        run: |
          DL_URL=$(head -1 .download_info)
          FILENAME=$(sed -n '2p' .download_info)
          mkdir -p downloaded_files
          echo "Downloading: $FILENAME"
          curl -L --fail --progress-bar -o "downloaded_files/$FILENAME" "$DL_URL"
          if [ ! -s "downloaded_files/$FILENAME" ]; then
            echo "::error::Downloaded file is empty!"
            exit 1
          fi
          echo "FILE_PATH=downloaded_files/$FILENAME" >> $GITHUB_ENV

      - name: ✂️ Split Large File (if needed)
        id: split
        run: |
          INPUT_FILE="${{ env.FILE_PATH }}"
          THRESH_MB="${{ github.event.inputs.max_part_mb }}"
          UPLOAD_METHOD="${{ github.event.inputs.upload_method }}"
          
          if [[ "$THRESH_MB" -le 0 ]] || [[ "$THRESH_MB" -gt 1900 ]]; then
            THRESH_MB=1800
          fi
          
          FILESIZE=$(stat -c%s "$INPUT_FILE" 2>/dev/null || echo 0)
          THRESH_BYTES=$((THRESH_MB * 1024 * 1024))
          
          # برای حالت repository، از آرشیو کردن با timestamp استفاده می‌کنیم
          if [[ "$UPLOAD_METHOD" == "repository (push to repo)" ]]; then
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            # ایجاد پوشه آرشیو با timestamp
            FINAL_DIR="downloads/youtube_${TIMESTAMP}"
            mkdir -p "$FINAL_DIR"
            
            if [ "$FILESIZE" -gt "$THRESH_BYTES" ]; then
              echo "🔪 نیاز به اسپلیت فایل (${THRESH_MB}MB)..."
              BASE_NAME=$(basename "$INPUT_FILE")
              BASE="${BASE_NAME%.*}"
              EXT="${BASE_NAME##*.}"
              
              # اسپلیت کردن فایل
              cd downloaded_files
              split -b ${THRESH_MB}M "$BASE_NAME" "${BASE}.part."
              cd ..
              
              # انتقال فایل‌های اسپلیت شده به پوشه نهایی
              mv downloaded_files/${BASE}.part.* "$FINAL_DIR/"
              # ذخیره اطلاعات فایل اصلی
              echo "$BASE_NAME" > "$FINAL_DIR/original_filename.txt"
              echo "$THRESH_MB" > "$FINAL_DIR/chunk_size_mb.txt"
              
              # حذف فایل اصلی
              rm -f "$INPUT_FILE"
              
              echo "SPLIT_DONE=true" >> $GITHUB_ENV
              echo "FINAL_DIR=$FINAL_DIR" >> $GITHUB_ENV
              echo "ORIGINAL_NAME=$BASE_NAME" >> $GITHUB_ENV
            else
              # انتقال فایل اصلی به پوشه نهایی
              mv "$INPUT_FILE" "$FINAL_DIR/"
              echo "SPLIT_DONE=false" >> $GITHUB_ENV
              echo "FINAL_DIR=$FINAL_DIR" >> $GITHUB_ENV
              echo "ORIGINAL_NAME=$(basename "$INPUT_FILE")" >> $GITHUB_ENV
            fi
          else
            # برای حالت release، فایل‌ها در release_files ذخیره می‌شن
            mkdir -p release_files
            if [ "$FILESIZE" -gt "$THRESH_BYTES" ]; then
              echo "🔪 Splitting into ${THRESH_MB}MB parts for release..."
              BASE="${FILENAME%.*}"
              cd downloaded_files
              zip -r -s "${THRESH_MB}m" "${BASE}.zip" "./$FILENAME"
              mv *.zip *.z* ../release_files/ 2>/dev/null || true
              cd ..
            else
              mv downloaded_files/* release_files/
            fi
            echo "SPLIT_DONE=false" >> $GITHUB_ENV
          fi

      - name: 📅 Get Current Date
        id: get_date
        run: echo "date=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: 📤 Push to Repository
        if: github.event.inputs.upload_method == 'repository (push to repo)'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # اضافه کردن فایل README برای هر دانلود
          cat > "${{ env.FINAL_DIR }}/README.md" << EOF
          # YouTube Download: ${{ steps.retrieve.outputs.title }}
          
          **Original URL:** ${{ github.event.inputs.video_url }}
          **Format:** ${{ github.event.inputs.output_format }}
          **Quality:** ${{ github.event.inputs.desired_quality }}
          **Downloaded on:** ${{ steps.get_date.outputs.date }}
          
          ## File Information
          - **Original Filename:** ${{ env.ORIGINAL_NAME }}
          - **Download Method:** YouTube Downloader
          
          EOF
          
          if [[ "${{ env.SPLIT_DONE }}" == "true" ]]; then
            cat >> "${{ env.FINAL_DIR }}/README.md" << EOF
          
          ## Split Information
          This file was split into chunks due to size limits.
          
          ### How to Reconstruct:
          **Linux/Mac:**
          \`\`\`bash
          cat *.part.* > ${{ env.ORIGINAL_NAME }}
          \`\`\`
          
          **Windows:**
          \`\`\`cmd
          copy /b *.part.* ${{ env.ORIGINAL_NAME }}
          \`\`\`
          EOF
          fi
          
          # Add and commit
          git add "${{ env.FINAL_DIR }}"
          
          # ایجاد commit message با اطلاعات کامل
          COMMIT_MSG="📥 YouTube Download: ${{ steps.retrieve.outputs.title }}
          
          - URL: ${{ github.event.inputs.video_url }}
          - Format: ${{ github.event.inputs.output_format }}
          - Quality: ${{ github.event.inputs.desired_quality }}
          - Original file: ${{ env.ORIGINAL_NAME }}
          - Split: ${{ env.SPLIT_DONE }}
          - Timestamp: ${{ steps.get_date.outputs.date }}
          
          [skip ci]"
          
          git commit -m "$COMMIT_MSG" || echo "Nothing to commit"
          
          # Push with retry
          for i in {1..3}; do
            if git push origin main --force-with-lease; then
              echo "✅ Successfully pushed to repository"
              break
            else
              echo "⚠️ Push failed, retrying in 5 seconds... (attempt $i/3)"
              sleep 5
              git pull origin main --rebase
            fi
          done
          
          # نمایش اطلاعات نهایی
          echo "=========================================="
          echo "✅ فایل با موفقیت به ریپازیتوری اضافه شد!"
          echo "📁 مسیر: ${{ env.FINAL_DIR }}"
          echo "📄 فایل: ${{ env.ORIGINAL_NAME }}"
          if [[ "${{ env.SPLIT_DONE }}" == "true" ]]; then
            echo "✂️ فایل به چند قسمت تقسیم شده است"
            echo "🔧 برای بازسازی فایل، به README مراجعه کنید"
          fi
          echo "=========================================="

      - name: 📤 Upload to GitHub Releases
        if: github.event.inputs.upload_method == 'release (GitHub Releases)'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('yt-{0}', github.run_number) }}
          name: ${{ format('YouTube - {0}', steps.retrieve.outputs.filename) }}
          body: |
            **📽️ YouTube Download**

            **Title:** ${{ steps.retrieve.outputs.title }}
            **Original Link:** ${{ github.event.inputs.video_url }}
            **Quality:** ${{ github.event.inputs.desired_quality }}
            **Format:** ${{ github.event.inputs.output_format }}
            **Downloaded on:** ${{ steps.get_date.outputs.date }}

            ---
            Powered by YouTube Downloader ⚡
          files: release_files/*
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

      - name: 🧹 Cleanup
        if: always()
        run: rm -rf downloaded_files release_files .download_info 2>/dev/null || true
